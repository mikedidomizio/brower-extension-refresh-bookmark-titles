<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Refresh Bookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Refresh Bookmarks</h1>
    <p class="description">Choose what to update, then fetch page titles for matching bookmarks.</p>

    <label class="scopeOption">
      <input type="checkbox" id="updateAllCheckbox">
      Only refresh empty titles
    </label>

    <button id="refreshButton" class="button">Refresh Now</button>

    <div id="output" class="output hidden">
      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
      <ul id="failures" class="failures hidden"></ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
